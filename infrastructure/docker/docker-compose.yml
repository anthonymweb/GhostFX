services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ghostfx
      POSTGRES_USER: ghostfx
      POSTGRES_PASSWORD: ghostfx
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"

  worker:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - ../../.env
    depends_on:
      - backend
      - redis
    command: sh -c "cd /app/apps/backend && celery -A app.tasks.celery_app.celery_app worker --loglevel=info"

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:5173"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  postgres_data:
