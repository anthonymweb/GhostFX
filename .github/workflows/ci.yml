name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck:frontend
      - run: npm run build:frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r apps/backend/requirements.txt
      - run: PYTHONPATH=apps/backend python -m compileall apps/backend/app
      - run: |
          PYTHONPATH=apps/backend python - <<'PY'
          from app.main import app
          assert app.title == "GhostFX AI Agent"
          PY
