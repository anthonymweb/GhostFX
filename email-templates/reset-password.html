<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset your GhostFX password</title>
</head>
<body style="margin:0;padding:0;background:#0f172a;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#0f172a;padding:40px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="background:#1e293b;border-radius:16px;overflow:hidden;border:1px solid rgba(255,255,255,0.06);">
          <tr>
            <td style="padding:48px 40px 32px;text-align:center;">
              <div style="display:inline-flex;align-items:center;justify-content:center;width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#22d3ee,#34d399);margin-bottom:24px;">
                <span style="font-size:20px;line-height:48px;">🔑</span>
              </div>
              <h1 style="margin:0 0 8px;font-size:24px;font-weight:700;color:#f8fafc;">Reset your password</h1>
              <p style="margin:0 0 32px;font-size:15px;line-height:1.6;color:#94a3b8;">
                Click below to choose a new password for your GhostFX account.
              </p>
              <a href="{{ .ConfirmationURL }}"
                 style="display:inline-block;padding:14px 32px;border-radius:10px;font-size:15px;font-weight:600;color:#0f172a;background:linear-gradient(135deg,#22d3ee,#34d399);text-decoration:none;">
                Reset password
              </a>
              <p style="margin:32px 0 0;font-size:13px;color:#64748b;line-height:1.5;">
                This link expires in 1 hour. Didn't request this? Ignore this email — your password stays the same.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 40px;border-top:1px solid rgba(255,255,255,0.06);text-align:center;">
              <p style="margin:0;font-size:12px;color:#475569;">
                GhostFX — decision-support software, not financial advice.
              </p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
